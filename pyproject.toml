[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aem-mcp-starter-kit"
version = "0.1.0"
description = "Model Context Protocol (MCP) Server for Adobe Experience Manager (AEM Sites, Content Fragments & Assets) with offline JCR simulator."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Faisal Abidi" }
]
keywords = [
    "aem",
    "adobe-experience-manager",
    "mcp",
    "model-context-protocol",
    "agentic-rag",
    "fastmcp",
    "ai-agents",
    "claude",
    "chatgpt"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "mcp[cli]>=1.3.0",
    "fastmcp>=0.4.0",
    "pydantic>=2.0.0",
    "urllib3>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
aem-mcp = "aem_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aem_mcp"]
